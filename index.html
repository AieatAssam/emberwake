<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0812">
  <meta name="description" content="Emberwake — carry the last Ember through the Gloam. A bullet-heaven survival roguelite with swarms, fusions and endless power creep.">
  <title>Emberwake</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23ff8a2a'/><circle cx='32' cy='32' r='12' fill='%23fff3c0'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game"></div>
  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><span id="lvl">LV 1</span></div>
    <div id="topbar">
      <div id="inv"></div>
      <div id="timer">00:00</div>
      <div id="counters"><span class="kills-ic">☠ <b id="kills">0</b></span><span class="cind-ic">✦ <b id="cinders">0</b></span></div>
    </div>
    <div id="bossbar"><div class="name"></div><div class="track"><div class="fill"></div></div></div>
    <div id="kindle"><div class="lbl">KINDLE</div><div class="mul">x1</div><div class="cnt"></div><div class="bar"><div></div></div><div class="next"></div></div>
    <div id="flare"><div class="fill"></div><span>FLARE <kbd>SPACE</kbd></span></div>
    <div id="toasts"></div>
    <button type="button" id="pausebtn" aria-label="Pause">II</button>
    <button type="button" id="flarebtn" aria-label="Flare">✹</button>
  </div>
  <div id="screen"></div>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="loading">Kindling…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
